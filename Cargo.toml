# Single project: every Rust crate lives in this workspace and shares one
# Cargo.lock — core (crates/*), desktop shell (src-tauri), CLI (cli), xtask.
[workspace]
resolver = "2"
members = ["crates/*", "src-tauri", "cli", "xtask"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["PlotVale contributors"]
repository = "https://github.com/EuropaVerse-studios/PlotVale"
rust-version = "1.90"

[workspace.dependencies]
# crate interne
plotvale-model = { path = "crates/model" }
plotvale-project = { path = "crates/project" }
plotvale-search = { path = "crates/search" }
plotvale-compile = { path = "crates/compile" }
plotvale-export = { path = "crates/export" }
# The desktop UI is React + TypeScript in src/ (Vite), served by the Tauri v2
# shell in src-tauri, which reuses these core crates by path.
# esterne
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ulid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
clap = { version = "4", features = ["derive"] }
docx-rs = "0.4"
epub-builder = "0.8"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Release tuning for the shipped binaries (Tauri shell + CLI). Moved here from
# src-tauri: profiles on non-root workspace members are ignored by Cargo.
# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
