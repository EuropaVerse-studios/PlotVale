[workspace]
resolver = "2"
members = ["crates/*", "apps/*", "xtask"]
# The Tauri app (npm + standalone Rust shell) is not a workspace member.
exclude = ["apps/plotvale-tauri", "apps/plotvale-tauri/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["PlotVale contributors"]
repository = "https://github.com/EuropaVerse-studios/PlotVale"
rust-version = "1.90"

[workspace.dependencies]
# crate interne
plotvale-model = { path = "crates/model" }
plotvale-project = { path = "crates/project" }
plotvale-search = { path = "crates/search" }
plotvale-compile = { path = "crates/compile" }
plotvale-export = { path = "crates/export" }
# The desktop UI is React + TypeScript in apps/plotvale-tauri (Tauri v2 shell
# in src-tauri reuses these core crates by path). No egui/eframe remains.
# esterne
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ulid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
clap = { version = "4", features = ["derive"] }
docx-rs = "0.4"
epub-builder = "0.8"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
