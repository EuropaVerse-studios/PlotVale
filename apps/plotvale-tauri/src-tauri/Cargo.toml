[package]
name = "plotvale-tauri"
version = "0.2.0"
description = "PlotVale novel-writing app: Tauri shell over the plotvale core crates"
authors = ["PlotVale contributors"]
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.90"

# Standalone crate inside the monorepo (excluded from the parent workspace):
# it reuses the GUI-less core (model/project/search/compile/export) by path.

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "plotvale_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = { version = "1", features = ["serde"] }
chrono = "0.4"
plotvale-model = { path = "../../../crates/model" }
plotvale-project = { path = "../../../crates/project" }
plotvale-search = { path = "../../../crates/search" }
plotvale-compile = { path = "../../../crates/compile" }
plotvale-export = { path = "../../../crates/export" }

[lints.rust]
unsafe_code = "forbid"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
