# Read the Docs configuration file (version 2).
# Reference: https://docs.readthedocs.com/platform/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

python:
  install:
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/conf.py
  # The project keeps CI warning-free; the documentation follows the same rule.
  fail_on_warning: true

# Offline formats (Sphinx only): the manual as a PDF and as an EPUB.
formats:
  - pdf
  - epub

search:
  ranking:
    index.html: 5
