[package]
name = "plotvale-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "PlotVale novel-writing app: Tauri shell over the plotvale core crates"

# Workspace member: reuses the GUI-less core (model/project/search/compile/
# export) by path, shares the root Cargo.lock and target dir.

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "plotvale_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = { version = "1", features = ["serde"] }
chrono = "0.4"
plotvale-model = { path = "../crates/model" }
plotvale-project = { path = "../crates/project" }
plotvale-search = { path = "../crates/search" }
plotvale-compile = { path = "../crates/compile" }
plotvale-export = { path = "../crates/export" }

[lints]
workspace = true
